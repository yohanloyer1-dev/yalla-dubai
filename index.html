<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Yalla Dubai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: a board-game box for one shared phone. Sticky top bar (brand, both players' scores, sound, map),
   a string-of-pearls progress row, a scrolling stage of photo cards and chunky answer tiles, a fixed bottom bar.
   Light-first "day in the souk" palette: warm sand, cream cards, coral for player one, Gulf teal for player two,
   one accent colour per chapter. A "night" palette for dark viewers keeps the same chapter colours. */
:root {
  --bg: #f6e8cc; --bg-2: #fffaf0; --bg-3: #fcf1dc;
  --fg: #2b2320; --fg-2: #6f6358; --line: rgba(43, 35, 32, 0.16); --line-2: rgba(43, 35, 32, 0.28);
  --gold: #e3a93a; --gold-2: #b97f0f; --gold-ink: #2b2320;
  --p1: #e85d3f; --p1-ink: #fff; --p2: #159e95; --p2-ink: #fff;
  --pearl: #fffdf7; --pearl-edge: rgba(90, 70, 30, 0.35);
  --ok: #2ea56c; --bad: #e0503c; --ok-bg: rgba(46, 165, 108, 0.14); --bad-bg: rgba(224, 80, 60, 0.14);
  --shadow: 0 10px 30px rgba(90, 60, 20, 0.14);
  --scrim: linear-gradient(180deg, rgba(43, 35, 32, 0) 35%, rgba(43, 35, 32, 0.55) 70%, rgba(43, 35, 32, 0.85) 100%);
  --ch: var(--gold);
  --font-display: 'Baloo Bhaijaan 2', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Nunito', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a2c; --bg-2: #222742; --bg-3: #1b2037;
    --fg: #f6efe2; --fg-2: #b5ac9c; --line: rgba(246, 239, 226, 0.16); --line-2: rgba(246, 239, 226, 0.3);
    --gold: #e9b445; --gold-2: #f3cd77; --gold-ink: #1d1708;
    --p1: #ff7a5c; --p1-ink: #2b1208; --p2: #35c7bd; --p2-ink: #052321;
    --pearl: #fffaf0; --pearl-edge: rgba(0, 0, 0, 0.3);
    --ok: #4ec98b; --bad: #ff7a66; --ok-bg: rgba(78, 201, 139, 0.16); --bad-bg: rgba(255, 122, 102, 0.16);
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    --scrim: linear-gradient(180deg, rgba(22, 26, 44, 0) 35%, rgba(22, 26, 44, 0.7) 70%, #161a2c 100%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a2c; --bg-2: #222742; --bg-3: #1b2037;
  --fg: #f6efe2; --fg-2: #b5ac9c; --line: rgba(246, 239, 226, 0.16); --line-2: rgba(246, 239, 226, 0.3);
  --gold: #e9b445; --gold-2: #f3cd77; --gold-ink: #1d1708;
  --p1: #ff7a5c; --p1-ink: #2b1208; --p2: #35c7bd; --p2-ink: #052321;
  --pearl: #fffaf0; --pearl-edge: rgba(0, 0, 0, 0.3);
  --ok: #4ec98b; --bad: #ff7a66; --ok-bg: rgba(78, 201, 139, 0.16); --bad-bg: rgba(255, 122, 102, 0.16);
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
  --scrim: linear-gradient(180deg, rgba(22, 26, 44, 0) 35%, rgba(22, 26, 44, 0.7) 70%, #161a2c 100%);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5; font-weight: 600;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .09;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120' fill='none' stroke='%23b97f0f' stroke-width='1.4'><path d='M60 10l13 37 37 13-37 13-13 37-13-37-37-13 37-13z'/><circle cx='60' cy='60' r='9'/></svg>");
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--ch); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.05; margin: 0; text-wrap: balance; }
p { margin: 0; }
.ar { font-family: var(--font-display); direction: rtl; unicode-bidi: isolate; font-weight: 700; }
.label { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-2); font-weight: 800; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; background: var(--ch); color: #fff; }

#app { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--line);
}
.topbar[hidden] { display: none; }
.brand { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; white-space: nowrap; }
.brand .ar { color: var(--gold-2); font-size: 1.2rem; }
.scorebar { display: flex; justify-content: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 4px; font-size: .9rem; font-weight: 800;
  background: var(--bg-2); border: 2px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip .tok { width: 24px; height: 24px; font-size: 15px; }
.chip.bump { animation: bump .5s ease-out; }
.chip .streak { color: var(--p1); font-size: .8rem; }
@keyframes bump { 30% { transform: scale(1.18); } 60% { transform: scale(.96); } }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--bg-2); border: 2px solid var(--line); border-radius: 999px;
  min-width: 40px; height: 40px; padding: 0 12px; font-size: .9rem; font-weight: 800; color: var(--fg);
}
.iconbtn:hover { border-color: var(--line-2); }
@media (max-width: 430px) {
  .topbar { gap: 6px; }
  .brand span:not(.ar) { display: none; }
  .chip { padding: 2px 8px 2px 3px; font-size: .82rem; gap: 4px; }
  .chip .tok { width: 22px; height: 22px; font-size: 13px; }
  .iconbtn { min-width: 36px; height: 36px; padding: 0 10px; font-size: .82rem; }
}
.pearlrow { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; padding: 8px 16px 2px; }
.pearlrow[hidden] { display: none; }
.pearl {
  width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0, var(--pearl) 45%, #b9b09d 100%);
  box-shadow: inset 0 0 0 1px var(--pearl-edge); opacity: .3; transition: opacity .3s, transform .3s;
}
.pearl.done { opacity: 1; }
.pearl.now { opacity: 1; transform: scale(1.4); box-shadow: inset 0 0 0 1px var(--pearl-edge), 0 0 0 3px color-mix(in srgb, var(--ch) 40%, transparent); }
.pearl.quiz { background: radial-gradient(circle at 35% 30%, var(--gold-2) 0, var(--gold) 55%, #7a5612 100%); }

/* ---------- tokens ---------- */
.tok {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; line-height: 1;
  background: var(--bg-3); border: 2px solid var(--line); flex: none;
}
.tok.p1 { background: var(--p1); border-color: var(--p1); }
.tok.p2 { background: var(--p2); border-color: var(--p2); }
.tok.big { width: 64px; height: 64px; font-size: 36px; }
.tok.wiggle { animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

/* ---------- stage ---------- */
.stage { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding-bottom: 120px; }
.screen { animation: enter .3s ease-out both; }
@keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes drop { 0% { transform: translateY(-30px) rotate(-10deg); opacity: 0; } 60% { transform: translateY(4px) rotate(2deg); opacity: 1; } 100% { transform: none; } }
@keyframes slidein { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shine { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.media { position: relative; overflow: hidden; background: var(--bg-3); }
.media img { display: block; width: 100%; height: 100%; object-fit: cover; max-width: 100%; }
.media.noimg img { display: none; }
.media.noimg::after { content: "دبي"; position: absolute; inset: 0; display: grid; place-items: center; font: 800 4rem var(--font-display); color: var(--gold); opacity: .5; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 14px 24px; font-weight: 800; font-size: 1.05rem;
  font-family: var(--font-display); border: 0; background: var(--gold); color: var(--gold-ink);
  box-shadow: 0 5px 0 color-mix(in srgb, var(--gold) 60%, #000 40%); transition: transform .08s ease-out, box-shadow .08s ease-out, filter .15s;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--gold) 60%, #000 40%); }
.btn.ch { background: var(--ch); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--ch) 60%, #000 40%); }
.btn.ch:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--ch) 60%, #000 40%); }
.btn.ghost { background: var(--bg-2); color: var(--fg); border: 2px solid var(--line-2); box-shadow: 0 5px 0 var(--line-2); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line-2); }
.btn.sm { padding: 10px 18px; font-size: .95rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.lg { padding: 18px 30px; font-size: 1.2rem; }

/* ---------- welcome ---------- */
.hero { position: relative; height: min(58vh, 520px); min-height: 340px; }
.hero .media { position: absolute; inset: 0; }
.hero .media img { animation: kenburns 30s ease-in-out infinite alternate; transform-origin: 60% 40%; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
.hero::after { content: ""; position: absolute; inset: 0; background: var(--scrim); }
.hero-text { position: absolute; inset: auto 0 0 0; padding-bottom: 14px; z-index: 1; color: #fff; }
.hero-text .ar { display: block; color: var(--gold); font-size: 2.4rem; line-height: 1; margin-bottom: 2px; text-shadow: 0 2px 20px rgba(0, 0, 0, .5); }
.hero-text h1 { font-size: clamp(3.2rem, 13vw, 5.4rem); color: #fff; text-shadow: 0 3px 30px rgba(0, 0, 0, .55); letter-spacing: -.01em; }
.sticker {
  position: absolute; top: 18px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 2; transform: rotate(6deg);
  background: var(--p1); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 8px 14px; border-radius: 14px; box-shadow: 0 6px 0 color-mix(in srgb, var(--p1) 60%, #000 40%); animation: drop .6s ease-out both;
}
.hero-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.hero-stats span { background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .35); color: #fff; border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 800; backdrop-filter: blur(6px); }
.setup { display: grid; gap: 22px; padding-top: 22px; }
.setup .intro { color: var(--fg-2); max-width: 60ch; font-weight: 600; }
.players { display: grid; gap: 16px; }
@media (min-width: 640px) { .players { grid-template-columns: 1fr 1fr; } }
.player-card { background: var(--bg-2); border: 2px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.player-card.p1 { border-color: var(--p1); }
.player-card.p2 { border-color: var(--p2); }
.player-card .head { display: flex; align-items: center; gap: 10px; }
.player-card .head .label { color: var(--fg-2); }
.field input {
  width: 100%; background: var(--bg-3); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 1.05rem; font-weight: 700; color: var(--fg);
}
.field input:focus { border-color: var(--ch); outline: none; }
.tokens { display: flex; gap: 8px; flex-wrap: wrap; }
.tokbtn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg-3); font-size: 24px; display: grid; place-items: center; transition: transform .15s ease-out, border-color .15s; padding: 0; }
.tokbtn:hover { transform: translateY(-2px) scale(1.06); }
.tokbtn.sel { border-width: 3px; transform: scale(1.1); }
.p1 .tokbtn.sel { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 18%, var(--bg-3)); }
.p2 .tokbtn.sel { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 18%, var(--bg-3)); }
.tokbtn.taken { opacity: .3; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .modes { grid-template-columns: 1fr; } }
.mode {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; background: var(--bg-2); border: 2px solid var(--line); border-radius: 20px; padding: 16px; color: var(--fg);
  box-shadow: 0 5px 0 var(--line); transition: transform .08s ease-out, box-shadow .08s ease-out, border-color .15s;
}
.mode:hover { border-color: var(--line-2); }
.mode:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.mode .ico { font-size: 34px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: var(--bg-3); }
.mode b { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; display: block; line-height: 1.1; }
.mode span.d { color: var(--fg-2); font-size: .9rem; font-weight: 600; }
.mode.primary { border-color: var(--gold); box-shadow: 0 5px 0 var(--gold-2); }
.howto { display: grid; gap: 8px; border-top: 2px solid var(--line); padding-top: 18px; color: var(--fg-2); font-size: .95rem; font-weight: 600; }
.howto b { color: var(--fg); font-weight: 800; }

/* ---------- map ---------- */
.map-head { padding-top: 22px; display: grid; gap: 8px; }
.map-head h2 { font-size: 2.2rem; }
.scores { display: flex; flex-wrap: wrap; gap: 10px; }
.tiles { display: grid; gap: 14px; padding-top: 18px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile {
  position: relative; display: grid; grid-template-rows: auto 1fr; text-align: left; background: var(--bg-2); border: 2px solid var(--line); border-radius: 22px; overflow: hidden;
  padding: 0; color: var(--fg); box-shadow: 0 6px 0 var(--line); transition: transform .1s ease-out, box-shadow .1s ease-out, border-color .15s;
}
.tile:hover { border-color: var(--ch); }
.tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.tile .media { aspect-ratio: 16 / 9; }
.tile .num {
  position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 50%; background: var(--ch); color: #fff; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
}
.tile .band { height: 8px; background: var(--ch); }
.tile .body { padding: 12px 14px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile h3 { font-size: 1.45rem; }
.tile .hook { color: var(--fg-2); font-size: .92rem; font-weight: 600; }
.tile .state { display: flex; gap: 10px; align-items: center; font-size: .85rem; color: var(--fg-2); margin-top: 4px; font-weight: 700; }
.tile.done { border-color: var(--ch); }
.tile.done .media::after { content: "✓ Done"; position: absolute; top: 12px; right: 12px; background: var(--ok); color: #fff; font-family: var(--font-display); font-weight: 800; padding: 4px 12px; border-radius: 999px; font-size: .85rem; }
.minipearls { display: inline-flex; gap: 3px; }
.minipearls .pearl { width: 9px; height: 9px; opacity: 1; }
.minipearls .pearl.p1 { background: radial-gradient(circle at 35% 30%, #fff 0, var(--p1) 55%, color-mix(in srgb, var(--p1) 60%, #000) 100%); }
.minipearls .pearl.p2 { background: radial-gradient(circle at 35% 30%, #fff 0, var(--p2) 55%, color-mix(in srgb, var(--p2) 60%, #000) 100%); }
.tile.special { grid-template-rows: none; grid-template-columns: auto 1fr; align-items: center; padding: 14px; gap: 14px; border-style: dashed; }
.tile.special .ico { font-size: 34px; width: 60px; height: 60px; display: grid; place-items: center; border-radius: 18px; background: var(--bg-3); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-3); border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 6px; font-size: .8rem; font-weight: 800; animation: pop .4s ease-out both; }

/* ---------- chapter intro ---------- */
.cover { position: relative; height: min(68vh, 620px); min-height: 420px; display: flex; align-items: flex-end; }
.cover .media { position: absolute; inset: 0; }
.cover .media img { animation: kenburns 30s ease-in-out infinite alternate; }
.cover::after { content: ""; position: absolute; inset: 0; background: var(--scrim); }
.cover-text { position: relative; z-index: 1; padding-bottom: 16px; display: grid; gap: 10px; color: #fff; }
.cover-text .ar { font-size: 3rem; line-height: 1; color: var(--gold); text-shadow: 0 2px 20px rgba(0, 0, 0, .4); }
.cover-text .translit { color: rgba(255, 255, 255, .8); font-size: .9rem; letter-spacing: .04em; }
.cover-text h2 { font-size: clamp(2.4rem, 9vw, 3.8rem); text-shadow: 0 2px 20px rgba(0, 0, 0, .45); color: #fff; }
.cover-text .hook { font-size: 1.15rem; max-width: 40ch; font-weight: 700; }
.cover-meta { color: var(--fg-2); font-size: .95rem; padding-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- cards ---------- */
.card { display: grid; }
.card .media { width: 100%; height: clamp(220px, 44vh, 440px); }
@media (min-width: 700px) { .card .media { border-radius: 0 0 22px 22px; } }
.card-body { padding-top: 18px; display: grid; gap: 12px; }
.card-body h3 { font-size: clamp(1.8rem, 6.5vw, 2.4rem); }
.card-body p.text { max-width: 62ch; font-size: 1.06rem; font-weight: 600; }
.fun {
  position: relative; display: grid; gap: 4px; background: var(--bg-2); border: 2px dashed color-mix(in srgb, var(--ch) 70%, var(--line)); border-radius: 18px; padding: 16px 14px 12px; margin-top: 10px;
  animation: drop .5s ease-out both;
}
.fun .k { position: absolute; top: -13px; left: 14px; transform: rotate(-2deg); background: var(--ch); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: .85rem; padding: 3px 12px; border-radius: 999px; box-shadow: 0 3px 0 rgba(0, 0, 0, .2); }
.fun p { font-size: .98rem; }
.try {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; margin-top: 4px;
  background: color-mix(in srgb, var(--gold) 14%, var(--bg-2)); border: 2px solid color-mix(in srgb, var(--gold) 60%, var(--line)); padding: 12px 14px; border-radius: 18px; color: var(--fg);
}
.try .ico { font-size: 22px; line-height: 1; margin-top: 2px; }
.try .label { color: var(--gold-2); margin-bottom: 2px; }
.try p { font-size: .98rem; }

/* ---------- turn banner + quiz ---------- */
.banner {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; border-radius: 20px; padding: 12px 14px; color: #fff;
  background: var(--pc); box-shadow: 0 5px 0 color-mix(in srgb, var(--pc) 60%, #000 40%); animation: slidein .35s ease-out both;
}
.banner .tok { background: rgba(255, 255, 255, .22); border-color: rgba(255, 255, 255, .5); }
.banner .who { display: grid; }
.banner .who .label { color: rgba(255, 255, 255, .85); }
.banner .who b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
.banner .qnum { font-size: .9rem; font-weight: 800; background: rgba(255, 255, 255, .2); padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.quiz, .bluff { padding-top: 18px; display: grid; gap: 18px; }
.q { font-size: clamp(1.55rem, 5.8vw, 2.1rem); max-width: 30ch; }
.options { display: grid; gap: 12px; }
.opt, .stmt {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--bg-2); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; font-size: 1.05rem; font-weight: 700; color: var(--fg);
  box-shadow: 0 5px 0 var(--line); transition: transform .08s ease-out, box-shadow .08s ease-out, border-color .15s, background .15s;
}
.opt:hover:not([disabled]), .stmt:hover:not([disabled]) { border-color: var(--ch); }
.opt:active:not([disabled]), .stmt:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.opt .k, .stmt .k { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-3); border: 2px solid var(--line); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--fg-2); }
.opt[disabled], .stmt[disabled] { cursor: default; }
.opt.correct, .stmt.truth { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 5px 0 var(--ok); }
.opt.correct .k, .stmt.truth .k { background: var(--ok); color: #fff; border-color: var(--ok); animation: pop .4s ease-out; }
.opt.wrong, .stmt.lie { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 5px 0 var(--bad); }
.opt.wrong { animation: shake .4s ease-out; }
.opt.wrong .k, .stmt.lie .k { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt.dim { opacity: .5; box-shadow: none; }
.opt.sel, .stmt.sel { border-color: var(--ch); background: color-mix(in srgb, var(--ch) 12%, var(--bg-2)); box-shadow: 0 5px 0 var(--ch); }
.opt.sel .k, .stmt.sel .k { background: var(--ch); color: #fff; border-color: var(--ch); }
.lockrow { display: grid; gap: 8px; justify-items: start; animation: pop .3s ease-out both; }
.lockrow .hint { color: var(--fg-2); font-size: .9rem; font-weight: 600; }
.lockrow .btn.lg { padding: 16px 28px; }
@keyframes shake { 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }
.why { display: grid; gap: 6px; background: var(--bg-2); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; animation: pop .35s ease-out both; }
.why .verdict { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; }
.why .verdict.ok { color: var(--ok); }
.why .verdict.bad { color: var(--bad); }
.why p { color: var(--fg); font-size: .98rem; font-weight: 600; }
.stmt { align-items: start; }
.stmt .k { margin-top: 0; }
.stmt .body { display: grid; gap: 6px; min-width: 0; }
.stmt .tag { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
.stmt.lie .tag { color: var(--bad); }
.stmt.truth .tag { color: var(--ok); }
.stmt.picked { outline: 3px solid var(--gold); outline-offset: 2px; }
.stmt .why { font-size: .92rem; color: var(--fg-2); padding: 0; border: 0; background: none; animation: enter .3s ease-out both; }
.round { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.round h3 { font-size: 1.4rem; color: var(--ch); }

/* ---------- summary / finale ---------- */
.summary, .finale { padding-top: 26px; display: grid; gap: 20px; }
.summary h2, .finale h2 { font-size: clamp(2.1rem, 7.5vw, 3rem); }
.trophy { font-size: 64px; line-height: 1; animation: drop .6s ease-out both; }
.tally { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.box { background: var(--bg-2); border: 2px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 6px; position: relative; box-shadow: var(--shadow); }
.box.p1 { border-color: var(--p1); }
.box.p2 { border-color: var(--p2); }
.box .big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.box .name { font-weight: 800; display: flex; align-items: center; gap: 8px; }
.box .crown { position: absolute; top: -14px; right: 12px; font-size: 28px; animation: drop .6s .3s ease-out both; }
.box .title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; color: var(--gold-2); }
.box .line { color: var(--fg-2); font-size: .9rem; }
.trylist { display: grid; gap: 8px; }
.trylist .item { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.trylist .ico { font-size: 20px; margin-top: 2px; }
.section-head { display: grid; gap: 4px; }
.section-head h3 { font-size: 1.7rem; }
.section-head p { color: var(--fg-2); font-weight: 600; }
.missions { display: grid; gap: 10px; }
@media (min-width: 640px) { .missions { grid-template-columns: 1fr 1fr; } }
.mission {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--bg-2); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; color: var(--fg); font-size: 1rem; font-weight: 700;
  box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s;
}
.mission:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.mission .cb { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line-2); display: grid; place-items: center; font-size: 16px; color: #fff; transition: background .2s; }
.mission.done { border-color: var(--ok); }
.mission.done .cb { background: var(--ok); border-color: var(--ok); animation: pop .35s ease-out; }
.mission.done span.t { color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--line-2); }
.progressline { color: var(--fg-2); font-size: .92rem; font-variant-numeric: tabular-nums; font-weight: 600; }
.meter { height: 12px; border-radius: 999px; background: var(--bg-3); border: 2px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2)); transition: width .6s ease-out; }
.credits { display: grid; gap: 6px; font-size: .85rem; color: var(--fg-2); font-weight: 600; }
.credits a { color: var(--fg-2); }
details summary { cursor: pointer; font-weight: 800; color: var(--fg); }
details { border-top: 2px solid var(--line); padding-top: 14px; }
.danger { color: var(--fg-2); font-size: .9rem; }
.danger button { background: none; border: 0; color: var(--bad); text-decoration: underline; padding: 0; font-weight: 800; }

/* ---------- bottom bar ---------- */
.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 2px solid var(--line);
}
.bottombar[hidden] { display: none; }
.bottombar .inner { max-width: 780px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.bottombar .step { text-align: center; color: var(--fg-2); font-size: .85rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }

canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
.fly { position: fixed; z-index: 30; width: 22px; height: 22px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 35% 30%, #fff 0, var(--pearl) 45%, #b9b09d 100%); box-shadow: 0 0 0 2px var(--gold), 0 4px 12px rgba(0, 0, 0, .3); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); z-index: 25; background: var(--fg); color: var(--bg); font-family: var(--font-display); font-weight: 800; padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow); animation: pop .35s ease-out both; max-width: calc(100vw - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<div id="app">
  <header class="topbar" id="topbar" hidden>
    <div class="brand"><span class="ar">يلا</span><span>Dubai</span></div>
    <div class="scorebar" id="scorebar"></div>
    <button class="iconbtn" id="soundbtn" type="button" aria-label="Toggle sound">🔊</button>
    <button class="iconbtn" id="mapbtn" type="button" aria-label="Open the chapter map">☰ Map</button>
  </header>
  <div class="pearlrow" id="pearls" hidden aria-hidden="true"></div>
  <main class="stage" id="stage"></main>
  <nav class="bottombar" id="bottombar" hidden>
    <div class="inner">
      <button class="btn ghost sm" id="backbtn" type="button">← Back</button>
      <div class="step" id="steplabel"></div>
      <button class="btn sm ch" id="nextbtn" type="button">Next →</button>
    </div>
  </nav>
</div>
<canvas id="fx" hidden></canvas>

<script src="data.js?v=3" charset="utf-8"></script>
<script src="credits.js?v=3" charset="utf-8"></script>
<script>
(function () {
  var D = window.YALLA, CREDITS = window.CREDITS || [];
  var KEY = "yalla-dubai-v2";
  var ARNUM = ["١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];
  var BADGES = {
    perfect: { e: "💎", t: "Perfect chapter" }, hattrick: { e: "🔥", t: "Hat-trick" }, champion: { e: "🏆", t: "Chapter champion" },
    detector: { e: "🕵️", t: "Lie detector" }, explorer: { e: "🧭", t: "All seven chapters" }, missions: { e: "⭐", t: "Ten missions done" }
  };

  var state = {
    screen: "welcome",          // welcome | map | chapter | bluff | finale
    names: ["", ""], tokens: [0, 1],
    ch: 0, step: 0,
    answers: {},                // chapterId -> [chosenIndex|null x4]
    streak: [0, 0], badges: [[], []],
    missions: {},
    bluff: { idx: 0, picks: [] },
    sel: null,                  // pending choice before lock-in: { id: "q:<chapter>:<k>" | "b:<round>", i: index }
    muted: false, started: false
  };

  /* ---------- persistence ---------- */
  function load() { try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (s && s.names) state = Object.assign(state, s); } } catch (e) {} }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function fresh() { return { screen: "welcome", names: ["", ""], tokens: [0, 1], ch: 0, step: 0, answers: {}, streak: [0, 0], badges: [[], []], missions: {}, bluff: { idx: 0, picks: [] }, sel: null, muted: false, started: false }; }
  function reset() { var m = state.muted; state = fresh(); state.muted = m; save(); render(); }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function name(i) { return state.names[i] && state.names[i].trim() ? state.names[i].trim() : (i === 0 ? "Player one" : "Player two"); }
  function tokOf(i) { var t = D.tokens[state.tokens[i]] || D.tokens[i]; return t.e; }
  function tok(i, cls) { return '<span class="tok p' + (i + 1) + (cls ? " " + cls : "") + '">' + tokOf(i) + '</span>'; }
  function img(key, alt) { return '<div class="media"><img src="img/' + key + '.jpg" alt="' + esc(alt || "") + '" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'noimg\')"></div>'; }
  function chapterAnswers(c) { return state.answers[D.chapters[c].id] || [null, null, null, null]; }
  function whoAnswers(c, k) { return (c + k) % 2; }
  function isSet(v) { return v !== null && v !== undefined; }
  function chapterDone(c) { return chapterAnswers(c).every(isSet); }
  function pearlsIn(c, p) { var ch = D.chapters[c], ans = chapterAnswers(c), n = 0; ch.quiz.forEach(function (q, k) { if (whoAnswers(c, k) === p && ans[k] === q.answer) n++; }); return n; }
  function totalPearls(p) { var n = 0; D.chapters.forEach(function (_, c) { n += pearlsIn(c, p); }); return n; }
  function allDone() { return D.chapters.every(function (_, c) { return chapterDone(c); }); }
  function steps(c) { var ch = D.chapters[c]; return 1 + ch.cards.length + ch.quiz.length + 1; }
  function stepKind(c, s) {
    var ch = D.chapters[c];
    if (s === 0) return { kind: "intro" };
    if (s <= ch.cards.length) return { kind: "card", i: s - 1 };
    if (s <= ch.cards.length + ch.quiz.length) return { kind: "quiz", i: s - 1 - ch.cards.length };
    return { kind: "summary" };
  }
  function rankFor(frac) { var r = D.ranks[0]; D.ranks.forEach(function (x) { if (frac >= x.min) r = x; }); return r; }
  function chColor(c) { return (D.chapters[c] && D.chapters[c].color) || "var(--gold)"; }
  function addBadge(p, id) { if (state.badges[p].indexOf(id) < 0) { state.badges[p].push(id); save(); toast(tokOf(p) + " " + name(p) + " · " + BADGES[id].e + " " + BADGES[id].t); return true; } return false; }
  function badgesHtml(p) { return state.badges[p].map(function (id) { var b = BADGES[id]; return b ? '<span class="badge">' + b.e + ' ' + esc(b.t) + '</span>' : ''; }).join(""); }
  /* bluff */
  function bluffWho(r) { return r % 2; }
  function bluffPearls(p) { var n = 0; D.bluff.forEach(function (rd, r) { var pk = state.bluff.picks[r]; if (bluffWho(r) === p && isSet(pk) && rd.statements[pk] && rd.statements[pk].lie) n++; }); return n; }
  function bluffDone() { return D.bluff.every(function (_, r) { return isSet(state.bluff.picks[r]); }); }

  /* ---------- sound (synthesised, no files) ---------- */
  var AC = null;
  function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { AC = null; } return AC; }
  function tone(f, dur, type, vol, when, slide) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, when);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, when + dur);
    g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol || 0.15, when + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(c.destination); o.start(when); o.stop(when + dur + 0.05);
  }
  function sfx(n) {
    if (state.muted) return; var c = ac(); if (!c) return; var t = c.currentTime;
    if (n === "tap") tone(740, 0.06, "sine", 0.06, t);
    else if (n === "ok") { tone(659, 0.14, "triangle", 0.18, t); tone(988, 0.16, "triangle", 0.18, t + 0.11); tone(1319, 0.3, "triangle", 0.16, t + 0.22); }
    else if (n === "bad") { tone(260, 0.3, "sawtooth", 0.08, t, 150); }
    else if (n === "pearl") { tone(1568, 0.08, "sine", 0.1, t); tone(2349, 0.14, "sine", 0.08, t + 0.07); }
    else if (n === "chapter") { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.25, "triangle", 0.16, t + i * 0.13); }); }
    else if (n === "win") { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.28, "triangle", 0.16, t + i * 0.14); }); tone(262, 1.2, "sine", 0.08, t + 0.9); }
    else if (n === "streak") { [880, 1109, 1319, 1760].forEach(function (f, i) { tone(f, 0.12, "square", 0.05, t + i * 0.07); }); }
    else if (n === "tick") { tone(1200, 0.04, "square", 0.03, t); }
  }

  /* ---------- rendering ---------- */
  var stage = document.getElementById("stage"), topbar = document.getElementById("topbar"), bottombar = document.getElementById("bottombar");
  var pearlsEl = document.getElementById("pearls"), stepLabel = document.getElementById("steplabel"), scorebar = document.getElementById("scorebar");
  var backBtn = document.getElementById("backbtn"), nextBtn = document.getElementById("nextbtn"), soundBtn = document.getElementById("soundbtn");

  function render(keepScroll) {
    save();
    var html = "";
    topbar.hidden = state.screen === "welcome";
    bottombar.hidden = !(state.screen === "chapter" || (state.screen === "bluff" && state.bluff.idx < D.bluff.length));
    pearlsEl.hidden = !(state.screen === "chapter" || (state.screen === "bluff" && state.bluff.idx < D.bluff.length));
    stage.style.setProperty("--ch", state.screen === "chapter" ? chColor(state.ch) : "var(--gold)");
    document.documentElement.style.setProperty("--ch", stage.style.getPropertyValue("--ch"));
    if (state.screen === "welcome") html = renderWelcome();
    else if (state.screen === "map") html = renderMap();
    else if (state.screen === "chapter") html = renderChapter();
    else if (state.screen === "bluff") html = renderBluff();
    else html = renderFinale();
    stage.innerHTML = '<div class="screen"' + (keepScroll ? ' style="animation:none"' : '') + '>' + html + "</div>";
    renderTop();
    if (!keepScroll) window.scrollTo(0, 0);
    bind();
  }

  function renderWelcome() {
    var cont = state.started;
    return '' +
      '<section class="hero">' + img("hero_skyline", "Dubai skyline at night") +
        '<div class="sticker">The family game</div>' +
        '<div class="hero-text gutter"><span class="ar">يلا دبي</span><h1>Yalla Dubai</h1>' +
        '<div class="hero-stats"><span>2 players</span><span>7 chapters</span><span>1 week in Dubai</span><span>🔊 sounds</span></div></div>' +
      '</section>' +
      '<section class="setup gutter">' +
        '<p class="intro">Pick a token each, read the photo cards together, then take turns on the questions. Every right answer wins a pearl, the thing this city was built on. Argue about the answers; that is the point.</p>' +
        '<div class="players">' + playerCard(0) + playerCard(1) + '</div>' +
        (cont ? '<div class="actions"><button class="btn lg" id="continuebtn" type="button">Continue the journey →</button></div>' : '') +
        '<div class="modes">' +
          '<button class="mode' + (cont ? '' : ' primary') + '" id="startbtn" type="button"><span class="ico">🧭</span><span><b>' + (cont ? 'Restart the journey' : 'The Journey') + '</b><span class="d">Seven chapters of photo cards, four questions each, in turns. About forty minutes, in any order, over the week if you like.</span></span></button>' +
          '<button class="mode" id="bluffbtn" type="button"><span class="ico">🤥</span><span><b>Dubai Bluff</b><span class="d">Two truths and a lie, sixteen rounds, turns alternate. About twelve minutes. Good over a karak.</span></span></button>' +
        '</div>' +
        '<div class="howto">' +
          '<p><b>How it works.</b> Pearls are points, chapters earn badges, three right answers in a row lights a streak. Progress saves on this phone, so you can stop and pick it up tomorrow.</p>' +
          '<p><b>Tip.</b> Swipe or use the arrow keys to move through cards; press 1 to 4 to answer. The 🔊 button at the top mutes the sounds.</p>' +
        '</div>' +
      '</section>';
  }
  function playerCard(i) {
    var taken = state.tokens[1 - i];
    return '<div class="player-card p' + (i + 1) + '"><div class="head">' + tok(i, "wiggle") + '<label class="field" style="flex:1"><span class="label">Player ' + (i ? 'two' : 'one') + '</span>' +
      '<input id="name' + i + '" placeholder="' + (i ? 'Their name' : 'Your name') + '" maxlength="18" autocomplete="off" value="' + esc(state.names[i]) + '"></label></div>' +
      '<div class="tokens" data-player="' + i + '">' + D.tokens.map(function (t, k) {
        return '<button class="tokbtn' + (state.tokens[i] === k ? ' sel' : '') + (taken === k ? ' taken' : '') + '" data-tok="' + k + '" type="button" title="' + esc(t.n) + '"' + (taken === k ? ' disabled' : '') + '>' + t.e + '</button>';
      }).join("") + '</div></div>';
  }

  function renderMap() {
    var h = '<section class="map-head gutter"><span class="label">The route</span><h2>Seven chapters</h2>' +
      '<div class="scores">' + chip(0, true) + chip(1, true) + '</div>' +
      (state.badges[0].length || state.badges[1].length ? '<div class="badges">' + badgesHtml(0) + badgesHtml(1) + '</div>' : '') + '</section>' +
      '<section class="tiles gutter">';
    D.chapters.forEach(function (ch, c) {
      var done = chapterDone(c), ans = chapterAnswers(c), started = ans.some(isSet);
      var stateTxt = done ? '<span class="minipearls">' + pearlDots(c) + '</span> ' + (pearlsIn(c, 0) + pearlsIn(c, 1)) + ' of ' + ch.quiz.length + ' pearls'
        : started ? '▶ In progress' : (ch.cards.length + ' cards · ' + ch.quiz.length + ' questions');
      h += '<button class="tile' + (done ? ' done' : '') + '" data-ch="' + c + '" type="button" style="--ch:' + ch.color + '">' +
        img(ch.cover, ch.title) + '<span class="num">' + (c + 1) + '</span><div class="band"></div>' +
        '<div class="body"><span class="label">Chapter ' + (c + 1) + ' · <span class="ar">' + ch.arabic + '</span></span>' +
        '<h3>' + esc(ch.title) + '</h3><p class="hook">' + esc(ch.hook) + '</p><div class="state">' + stateTxt + '</div></div></button>';
    });
    var fin = allDone();
    h += '<button class="tile special" data-finale="1" type="button"><span class="ico">' + (fin ? '🏆' : '📍') + '</span>' +
      '<div class="body"><span class="label">Finale</span><h3>' + (fin ? 'Your Dubai rank' : 'Missions for the week') + '</h3>' +
      '<p class="hook">' + (fin ? 'Scores, titles, badges and the mission checklist.' : 'Sixteen things to actually do in the city. Ranks unlock when all chapters are done.') + '</p></div></button>';
    h += '<button class="tile special" data-bluff="1" type="button"><span class="ico">🤥</span>' +

  function pearlDots(c) { var s = "", ch = D.chapters[c], ans = chapterAnswers(c); ch.quiz.forEach(function (q, k) { if (ans[k] === q.answer) s += '<span class="pearl p' + (whoAnswers(c, k) + 1) + '"></span>'; }); return s; }

  function banner(p, label, right) {

  function renderBluff() {

        '<p>Bluff score: ' + esc(name(0)) + ' ' + bluffPearls(0) + ' · ' + esc(name(1)) + ' ' + bluffPearls(1) + '</p></div>';

  function renderFinale() {

  function renderTop() {

      for (var b = 0; b < nb; b++) { var e = document.createElement("span"); e.className = "pearl quiz" + (b < cur ? " done" : "") + (b === cur ? " now" : ""); pearlsEl.appendChild(e); }
      stepLabel.textContent = cur < nb ? "Round " + (cur + 1) + " of " + nb : "Final";
      backBtn.disabled = cur === 0;

  /* ---------- actions ---------- */
  function go(screen, extra) { state.screen = screen; if (extra) Object.assign(state, extra); render(); }
  function pendingFor(id) { return state.sel && state.sel.id === id ? state.sel.i : null; }
  function select(id, i, max) {
    if (i < 0 || i >= max) return;
    state.sel = { id: id, i: i }; save(); sfx("tick"); render(true);
  }
  function lockIn() {
    if (!state.sel) return false;
    if (state.screen === "bluff") { var r = state.bluff.idx; if (state.sel.id === "b:" + r && !isSet(state.bluff.picks[r])) { var bi = state.sel.i; state.sel = null; commitBluff(bi); return true; } }
    if (state.screen === "chapter") { var sk = stepKind(state.ch, state.step); if (sk.kind === "quiz" && state.sel.id === "q:" + D.chapters[state.ch].id + ":" + sk.i && !isSet(chapterAnswers(state.ch)[sk.i])) { var qi = state.sel.i; state.sel = null; commitAnswer(qi); return true; } }
    return false;
  }
  function next() {
    if (lockIn()) return;
    if (state.screen === "bluff") { var r = state.bluff.idx; if (r >= D.bluff.length || !isSet(state.bluff.picks[r])) return; sfx("tap"); state.bluff.idx++; render(); return; }
    if (state.screen !== "chapter") return;
    var sk = stepKind(state.ch, state.step);
    if (sk.kind === "summary") return;
    if (sk.kind === "quiz" && !isSet(chapterAnswers(state.ch)[sk.i])) return;
    sfx("tap"); state.step++;
    if (stepKind(state.ch, state.step).kind === "summary") { chapterEnd(state.ch); }
    render();
  }
  function revealScroll() { setTimeout(function () { var w = stage.querySelector(".quiz > .why, .bluff > .why"); if (w && w.scrollIntoView) w.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); }, 80); }
  function back() {
    if (state.screen === "bluff" && state.bluff.idx > 0) { sfx("tap"); state.bluff.idx--; render(); return; }
    if (state.screen === "chapter" && state.step > 0) { sfx("tap"); state.step--; render(); }
  }
  function chapterEnd(c) {
    sfx("chapter");
    var a = pearlsIn(c, 0), b = pearlsIn(c, 1);
    [0, 1].forEach(function (p) { var mine = D.chapters[c].quiz.filter(function (_, k) { return whoAnswers(c, k) === p; }).length; if (pearlsIn(c, p) === mine) addBadge(p, "perfect"); });
    if (a !== b) addBadge(a > b ? 0 : 1, "champion");
    if (allDone()) { addBadge(0, "explorer"); addBadge(1, "explorer"); }
    setTimeout(function () { confetti(80, 2500); }, 150);
  }
  function answer(i) {
    // first tap selects; lock-in (button, Enter, or the bottom bar) commits
    if (state.screen === "bluff") { var r = state.bluff.idx; if (r < D.bluff.length && !isSet(state.bluff.picks[r])) select("b:" + r, i, 3); return; }
    if (state.screen !== "chapter") return;
    var sk0 = stepKind(state.ch, state.step);
    if (sk0.kind === "quiz" && !isSet(chapterAnswers(state.ch)[sk0.i])) select("q:" + D.chapters[state.ch].id + ":" + sk0.i, i, 4);
  }
  function commitAnswer(i) {
    var c = state.ch, sk = stepKind(c, state.step);
    if (sk.kind !== "quiz") return;
    var ch = D.chapters[c], ans = chapterAnswers(c).slice();
    if (isSet(ans[sk.i])) return;
    ans[sk.i] = i; state.answers[ch.id] = ans;
    var p = whoAnswers(c, sk.i), correct = i === ch.quiz[sk.i].answer;

    else state.streak[p] = 0;
    save();
    render(true);
    if (correct) { sfx("ok"); flyPearl(from, p); burstAt(from, chColor(c)); } else { sfx("bad"); }
    revealScroll();
  }
  function commitBluff(i) {
    var r = state.bluff.idx; if (state.screen !== "bluff" || r >= D.bluff.length || isSet(state.bluff.picks[r])) return;
    state.bluff.picks[r] = i; save();
    var p = bluffWho(r), ok = D.bluff[r].statements[i].lie, from = stage.querySelector('[data-stmt="' + i + '"]');
    render(true);
    if (ok) { sfx("ok"); flyPearl(from, p); burstAt(from, "var(--p" + (p + 1) + ")"); if (r === D.bluff.length - 1 && bluffPearls(p) === D.bluff.length / 2) addBadge(p, "detector"); } else sfx("bad");
    if (r === D.bluff.length - 1) setTimeout(function () { sfx("win"); confetti(120, 3200); }, 700);
    revealScroll();
  }

  function bind() {

    };
    if ((el = document.getElementById("continuebtn"))) el.onclick = function () { readNames(); sfx("tap"); go("map"); };
    if ((el = document.getElementById("bluffbtn"))) el.onclick = function () { readNames(); sfx("tap"); if (bluffDone()) state.bluff = { idx: 0, picks: [] }; go("bluff"); };
    ["name0", "name1"].forEach(function (id, i) { var inp = document.getElementById(id); if (inp) inp.oninput = function () { state.names[i] = inp.value; save(); }; });
    stage.querySelectorAll("[data-player]").forEach(function (grp) {

      grp.querySelectorAll("[data-tok]").forEach(function (b) { b.onclick = function () { var k = +b.getAttribute("data-tok"); if (state.tokens[1 - i] === k) return; state.tokens[i] = k; sfx("pearl"); readNames(); save(); render(true); }; });
    });
    stage.querySelectorAll("[data-ch]").forEach(function (b) { b.onclick = function () { sfx("tap"); state.ch = +b.getAttribute("data-ch"); state.step = chapterDone(state.ch) ? steps(state.ch) - 1 : 0; go("chapter"); }; });

    stage.querySelectorAll("[data-stmt]").forEach(function (b) { b.onclick = function () { answer(+b.getAttribute("data-stmt")); }; });
    if ((el = document.getElementById("lockbtn"))) el.onclick = function () { lockIn(); };

      if (state.missions[id]) { sfx("pearl"); burstAt(b, "var(--ok)"); var n = D.missions.filter(function (m) { return state.missions[m.id]; }).length; if (n >= 10) { addBadge(0, "missions"); addBadge(1, "missions"); } } else sfx("tap");
      render(true);
    }; });
    if ((el = document.getElementById("nextch"))) el.onclick = function () { sfx("tap"); state.ch++; state.step = 0; render(); };
    if ((el = document.getElementById("tomap"))) el.onclick = function () { sfx("tap"); go("map"); };
    if ((el = document.getElementById("tofinale"))) el.onclick = function () { sfx("tap"); go("finale"); };
    if ((el = document.getElementById("bluffagain"))) el.onclick = function () { sfx("tap"); state.bluff = { idx: 0, picks: [] }; render(); };
    if ((el = document.getElementById("towelcome"))) el.onclick = function () { sfx("tap"); go("welcome"); };
    if ((el = document.getElementById("resetbtn"))) el.onclick = function () { el.textContent === "Start over" ? (el.textContent = "Tap again to confirm") : reset(); };
    if (state.screen === "finale" && allDone() && !state._celebrated) { state._celebrated = true; save(); sfx("win"); confetti(160, 4000); }
